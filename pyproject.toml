[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canvasity"
version = "0.4.0"
description = "A local, infinite-canvas whiteboard built with PySide6"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
canvasity = "canvasity.app:run"

[tool.setuptools.packages.find]
include = ["canvasity*"]

[tool.setuptools.package-data]
canvasity = ["assets/icons/*.svg"]
